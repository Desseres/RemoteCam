<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemoteCam live</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;object-fit:contain}
#status{position:absolute;inset:0;display:grid;place-content:center;color:#eee;font:18px system-ui;text-align:center;padding:24px}
#status[hidden]{display:none}
</style></head><body>
<canvas id="video"></canvas><div id="status" role="status">Connecting to RemoteCam…</div>
<script>
'use strict';
const canvas = document.getElementById('video');
const context = canvas.getContext('2d', {alpha: false});
const status = document.getElementById('status');
let socket;
let reconnect;
// Exposed for local diagnostics. ACK is after a canvas draw, not after OBS output/display.
window.remoteCam = {frames: 0, width: 0, height: 0, lastFrameAt: 0};
function connect() {
    const connection = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/live');
    socket = connection;
    connection.binaryType = 'arraybuffer';
    connection.onmessage = async event => {
        if (!(event.data instanceof ArrayBuffer) || event.data.byteLength < 9) return;
        try {
            const sequence = new DataView(event.data).getBigInt64(0, false).toString();
            const bitmap = await createImageBitmap(new Blob([event.data.slice(8)], {type: 'image/jpeg'}));
            if (socket !== connection || connection.readyState !== WebSocket.OPEN) { bitmap.close(); return; }
            // Draw immediately: waiting for requestAnimationFrame before acknowledging would
            // add a refresh interval to the feedback loop and unnecessarily reduce capture FPS.
            if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
                canvas.width = bitmap.width; canvas.height = bitmap.height;
            }
            context.drawImage(bitmap, 0, 0);
            bitmap.close();
            window.remoteCam.frames++;
            window.remoteCam.width = canvas.width;
            window.remoteCam.height = canvas.height;
            window.remoteCam.lastFrameAt = performance.now();
            status.hidden = true;
            connection.send(sequence);
        } catch (error) { connection.close(); }
    };
    connection.onclose = () => {
        if (socket !== connection) return;
        context.clearRect(0, 0, canvas.width, canvas.height);
        status.textContent = 'Waiting for camera. Enable Stream in RemoteCam.';
        status.hidden = false;
        reconnect = setTimeout(connect, 1000);
    };
    connection.onerror = () => connection.close();
}
window.addEventListener('pagehide', () => { clearTimeout(reconnect); const old = socket; socket = null; old?.close(); });
connect();
</script></body></html>
