<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemoteCam • WebRTC</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#edf2f8;font:16px system-ui}
video{width:100%;height:100%;object-fit:contain;display:block}
#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px;padding:32px;background:#10151d}
#status[hidden],#stats[hidden]{display:none}h1{font-size:24px;margin:0}p{max-width:560px;line-height:1.6;color:#b8c4d5}
#stats{position:absolute;bottom:12px;left:12px;padding:10px 14px;border-radius:8px;background:#10151de6;font:13px monospace;white-space:pre-line}
#sound{position:absolute;right:16px;bottom:16px;background:#343434;color:#fff;border:1px solid #777;padding:12px 18px;font:inherit;cursor:pointer}
#sound[hidden]{display:none}
</style></head><body>
<video id="video" autoplay playsinline muted></video>
<div id="status" role="status"><h1>RemoteCam · WebRTC</h1><p id="message">Connecting to the phone…</p></div>
<output id="stats" hidden></output>
<button id="sound" type="button" hidden>Enable sound</button>
<script>
'use strict';
const video = document.getElementById('video');
const status = document.getElementById('status');
const message = document.getElementById('message');
const stats = document.getElementById('stats');
const sound = document.getElementById('sound');
const startMuted = new URLSearchParams(location.search).get('muted') === '1';
let soundAllowed = !startMuted;
sound.onclick = async () => {
    soundAllowed = true;
    video.muted = false;
    try { await video.play(); sound.hidden = true; }
    catch (_) { video.muted = true; sound.hidden = false; }
};
stats.hidden = !new URLSearchParams(location.search).has('stats');
let active, retry, stopped = false;
function connect() {
    if (stopped) return;
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/signal');
    const pc = new RTCPeerConnection({iceServers: []});
    const current = {ws, pc, stream: new MediaStream(), pending: [], localIce: [], offerSent: false, timer: null, bytes: 0, time: 0, frames: 0, lastFrame: performance.now()};
    active = current;
    let explanation = 'Select a WebRTC format and enable Stream on the phone. Reconnecting…';
    const incoming = pc.addTransceiver('video', {direction: 'recvonly'});
    const audio = pc.addTransceiver('audio', {direction: 'recvonly'});
    const opus = RTCRtpReceiver.getCapabilities('audio')?.codecs.filter(c => c.mimeType.toLowerCase() === 'audio/opus') || [];
    if (opus.length && audio.setCodecPreferences) audio.setCodecPreferences(opus);
    // Offer both codecs the receiver actually supports. The phone strictly selects its
    // chosen format; an H.265 test never silently falls back to H.264. Keep repair codecs
    // available for retransmissions rather than stripping RTX from codec preferences.
    const capabilities = RTCRtpReceiver.getCapabilities('video')?.codecs || [];
    const codecs = ['video/h264', 'video/h265'].flatMap(type => capabilities.filter(c => c.mimeType.toLowerCase() === type));
    const repair = capabilities.filter(c => ['video/rtx', 'video/red', 'video/ulpfec'].includes(c.mimeType.toLowerCase()));
    let codecError;
    try {
        if (!codecs.length) throw new Error('This receiver does not support H.264 or H.265 WebRTC. Use another browser or select JPEG on the phone.');
        if (incoming.setCodecPreferences) incoming.setCodecPreferences([...codecs, ...repair]);
    } catch (error) { codecError = error; }
    function send(text) { if (ws.readyState === WebSocket.OPEN) ws.send(text); }
    pc.onicecandidate = ({candidate: c}) => {
        if (!c) return;
        const signal = 'ice\n' + (c.sdpMid ?? '') + '\n' + c.sdpMLineIndex + '\n' + c.candidate;
        if (current.offerSent) send(signal); else current.localIce.push(signal);
    };
    pc.ontrack = async event => {
        if (active !== current) return;
        current.stream.addTrack(event.track);
        if (video.srcObject !== current.stream) video.srcObject = current.stream;
        const hasAudio = current.stream.getAudioTracks().length > 0;
        video.muted = !hasAudio || !soundAllowed;
        sound.hidden = !hasAudio || soundAllowed;
        try { await video.play(); }
        catch (_) {
            if (active !== current) return;
            // Autoplay policy must never prevent the video from appearing.
            video.muted = true;
            sound.hidden = !hasAudio;
            video.play().catch(() => {});
        }
    };
    video.onplaying = () => { if (active === current) status.hidden = true; };
    pc.onconnectionstatechange = () => {
        if (active !== current) return;
        if (pc.connectionState === 'failed' || pc.connectionState === 'closed') ws.close();
        if (pc.connectionState === 'disconnected') { status.hidden = false; message.textContent = 'Connection interrupted. Reconnecting…'; ws.close(); }
    };
    ws.onopen = async () => {
        try {
            if (codecError) throw codecError;
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            send('offer\n' + offer.sdp);
            current.offerSent = true;
            current.localIce.forEach(send); current.localIce = [];
        } catch (error) { explanation = error.message; ws.close(); }
    };
    let chain = Promise.resolve();
    ws.onmessage = event => {
        chain = chain.then(async () => {
            if (active !== current) return;
            const text = event.data;
            if (text.startsWith('answer\n')) {
                await pc.setRemoteDescription({type:'answer', sdp:text.slice(7)});
                for (const c of current.pending) await pc.addIceCandidate(c);
                current.pending = [];
            } else if (text.startsWith('ice\n')) {
                const parts = text.split('\n');
                const c = {sdpMid:parts[1], sdpMLineIndex:Number(parts[2]), candidate:parts.slice(3).join('\n')};
                if (pc.remoteDescription) await pc.addIceCandidate(c); else current.pending.push(c);
            } else if (text.startsWith('error\n') || text.startsWith('reset\n')) {
                explanation = text.slice(text.indexOf('\n') + 1); ws.close();
            }
        }).catch(error => { explanation = error.message; ws.close(); });
    };
    ws.onerror = () => ws.close();
    ws.onclose = () => {
        clearInterval(current.timer); pc.close();
        if (active !== current) return;
        video.srcObject = null; sound.hidden = true; status.hidden = false; message.textContent = explanation;
        retry = setTimeout(connect, 1500);
    };
    // DOM diagnostics are optional and do not affect media flow or acknowledge playback.
    current.timer = setInterval(async () => {
        if (active !== current) return;
        if (performance.now() - current.lastFrame > 15000) { explanation = 'No video received. Check the selected format, resolution and local network. Reconnecting…'; ws.close(); return; }
        if (pc.connectionState !== 'connected') return;
        try {
        const report = await pc.getStats();
        report.forEach(item => {
            if (item.type !== 'inbound-rtp' || item.kind !== 'video') return;
            const codec = report.get(item.codecId)?.mimeType || 'unknown';
            const rate = current.time ? (item.bytesReceived - current.bytes) * 8 / (item.timestamp - current.time) / 1000 : 0;
            current.bytes = item.bytesReceived; current.time = item.timestamp;
            if (item.framesDecoded > current.frames) { current.lastFrame = performance.now(); current.frames = item.framesDecoded; }
            const jitter = item.jitterBufferEmittedCount ? item.jitterBufferDelay / item.jitterBufferEmittedCount * 1000 : 0;
            video.dataset.codec = codec;
            video.dataset.frames = String(item.framesDecoded || 0);
            video.dataset.fps = String(item.framesPerSecond || 0);
            video.dataset.mbps = rate.toFixed(2);
            video.dataset.jitterMs = jitter.toFixed(1);
            stats.textContent = `${codec} · ${video.videoWidth}×${video.videoHeight}\n${item.framesPerSecond || 0} fps · ${rate.toFixed(1)} Mb/s · buffer avg ${jitter.toFixed(1)} ms`;
        });
        } catch (error) { if (active === current) { explanation = error.message; ws.close(); } }
    }, 1000);
}
window.addEventListener('pagehide', () => { stopped = true; clearTimeout(retry); const old = active; active = null; if (old) { clearInterval(old.timer); old.ws.close(); old.pc.close(); } });
connect();
</script></body></html>
