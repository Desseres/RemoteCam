plugins { id 'com.android.application' }
android {
    namespace = 'com.samsung.android.scan3d'
    compileSdk { version = release(37) }
    defaultConfig {
        applicationId = 'pl.remotecam.app'
        minSdk = 28
        targetSdk = 37
        versionCode = 18
        versionName = '0.3.3-h265.1'
        testInstrumentationRunner = 'com.samsung.android.scan3d.JpegRotationInstrumentation'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures { viewBinding = true }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging { resources.excludes += 'META-INF/INDEX.LIST' }
}
dependencies {
    implementation project(':utils')
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'io.ktor:ktor-server-cio:3.5.2'
    implementation 'io.ktor:ktor-server-websockets:3.5.2'
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
    testImplementation 'junit:junit:4.13.2'
}
