<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920"><rect x="0" y="0" width="1080" height="1920" rx="0" fill="#171819"/><rect x="0" y="0" width="1080" height="14" rx="0" fill="#FFE15A"/><g transform="translate(46 40) scale(1.1)"><path fill="#FFE15A" d="M31 37H40L44 31H62L66 37H77Q82 37 82 42V70Q82 75 77 75H31Q26 75 26 70V42Q26 37 31 37Z"/><circle cx="54" cy="55" r="14" fill="#151515"/><circle cx="54" cy="55" r="8" fill="#FFE15A"/><circle cx="72" cy="45" r="3" fill="#151515"/><path d="M72 26Q80 27 83 34M74 19Q87 21 91 32" fill="none" stroke="#FFE15A" stroke-width="3" stroke-linecap="round"/></g><text x="174" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="600" fill="#F4F3EF">RemoteCam</text><text x="72" y="219" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#FFE15A">OD TELEFONU DO PODGLĄDU</text><rect x="72" y="1852" width="936" height="1" rx="0" fill="#454646"/><text x="72" y="1895" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#B5B7B8">05 / 06</text><text x="713" y="1895" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="400" fill="#B5B7B8">TELEFON → KOMPUTER</text><text x="72" y="318" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="600" fill="#F4F3EF">Trzy kroki.</text><text x="72" y="403.12" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="600" fill="#F4F3EF">I masz obraz.</text><rect x="72" y="534" width="936" height="314" rx="12" fill="#252729"/><text x="108" y="612" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="600" fill="#FFE15A">01</text><text x="108" y="687" font-family="Segoe UI,Arial,sans-serif" font-size="45" font-weight="600" fill="#F4F3EF">Połącz urządzenia</text><text x="108" y="753" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="400" fill="#BDC0C1">Telefon i komputer w tej samej,</text><text x="108" y="795.5" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="400" fill="#BDC0C1">zaufanej sieci lokalnej.</text><rect x="72" y="894" width="936" height="314" rx="12" fill="#252729"/><text x="108" y="972" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="600" fill="#FFE15A">02</text><text x="108" y="1047" font-family="Segoe UI,Arial,sans-serif" font-size="45" font-weight="600" fill="#F4F3EF">Włącz Stream</text><text x="108" y="1113" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="400" fill="#BDC0C1">Wybierz format i ustaw kamerę.</text><text x="108" y="1155.5" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="400" fill="#BDC0C1">Skopiuj adres z aplikacji.</text><rect x="72" y="1254" width="936" height="314" rx="12" fill="#252729"/><text x="108" y="1332" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="600" fill="#FFE15A">03</text><text x="108" y="1407" font-family="Segoe UI,Arial,sans-serif" font-size="45" font-weight="600" fill="#F4F3EF">Otwórz odbiornik</text><text x="108" y="1473" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="400" fill="#BDC0C1">Wklej adres w OBS Browser</text><text x="108" y="1515.5" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="400" fill="#BDC0C1">lub skonfiguruj źródło w go2rtc.</text><text x="72" y="1717" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="400" fill="#CFD0D0">Transmisja wideo. Mikrofon komputera</text><text x="72" y="1755.75" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="400" fill="#CFD0D0">dodajesz osobno w OBS.</text></svg>